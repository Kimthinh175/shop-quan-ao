<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm sản phẩm mới | Closet Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 flex h-screen overflow-hidden">

    <!-- Sidebar (Same as products.html) -->
    <aside class="w-72 bg-indigo-900 h-full flex flex-col py-8 px-6 text-indigo-100 shrink-0">
        <div class="text-3xl font-black mb-12 tracking-tighter text-white">CLOSET.</div>
        <nav class="flex-1 space-y-2">
            <a href="dashboard.html" class="flex items-center gap-4 px-4 py-3 hover:bg-indigo-800 rounded-xl transition-all font-medium"><i class="fa-solid fa-chart-pie text-lg"></i> Tổng quan</a>
            <a href="pos.html" class="flex items-center gap-4 px-4 py-3 hover:bg-indigo-800 rounded-xl transition-all font-medium"><i class="fa-solid fa-cash-register text-lg"></i> Bán hàng (POS)</a>
            <a href="products.html" class="flex items-center gap-4 px-4 py-3 bg-indigo-800 text-white rounded-xl shadow-lg font-bold"><i class="fa-solid fa-box text-lg"></i> Quản lý kho</a>
            <a href="orders.html" class="flex items-center gap-4 px-4 py-3 hover:bg-indigo-800 rounded-xl transition-all font-medium"><i class="fa-solid fa-receipt text-lg"></i> Đơn hàng</a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <!-- Topbar -->
        <header class="h-20 bg-white border-b border-slate-200 px-10 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-4">
                <a href="products.html" class="w-10 h-10 rounded-xl bg-slate-50 text-slate-400 flex items-center justify-center hover:bg-indigo-600 hover:text-white transition-all"><i class="fa-solid fa-arrow-left"></i></a>
                <h1 class="text-xl font-black text-slate-800">Thêm sản phẩm mới</h1>
            </div>
            <div class="flex items-center gap-4">
                <button class="px-8 py-2 bg-slate-100 text-slate-600 font-bold rounded-xl hover:bg-slate-200 transition-all">Lưu nháp</button>
                <button class="px-8 py-2 bg-indigo-600 text-white font-bold rounded-xl shadow-lg shadow-indigo-100 hover:bg-indigo-700 transition-all">Đăng bán ngay</button>
            </div>
        </header>

        <!-- Content -->
        <div class="flex-1 overflow-y-auto p-10 custom-scrollbar">
            <div class="grid grid-cols-3 gap-10">
                <!-- Main Form -->
                <div class="col-span-2 space-y-8">
                    <div class="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm space-y-6">
                        <h2 class="text-lg font-black text-slate-800">Thông tin cơ bản</h2>
                        <div class="space-y-4">
                            <div class="space-y-2">
                                <label class="text-xs font-black uppercase tracking-widest text-slate-400">Tên sản phẩm</label>
                                <input type="text" placeholder="Ví dụ: Áo Sơ Mi Oxford Slim Fit" class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-black uppercase tracking-widest text-slate-400">Mô tả chi tiết</label>
                                <textarea placeholder="Nhập mô tả sản phẩm của bạn..." class="w-full h-48 px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 transition-all resize-none"></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm space-y-6">
                        <h2 class="text-lg font-black text-slate-800">Hình ảnh sản phẩm</h2>
                        <div class="grid grid-cols-4 gap-4">
                            <!-- Upload Button -->
                            <div class="aspect-square border-2 border-dashed border-slate-200 rounded-2xl flex flex-col items-center justify-center gap-2 text-slate-400 hover:border-indigo-500 hover:text-indigo-600 hover:bg-indigo-50 cursor-pointer transition-all">
                                <i class="fa-solid fa-cloud-arrow-up text-2xl"></i>
                                <span class="text-[10px] font-bold uppercase tracking-widest text-center">Tải lên</span>
                            </div>
                            <!-- Image Preview -->
                            <div class="aspect-square bg-slate-50 rounded-2xl relative group overflow-hidden border border-slate-100">
                                <img src="https://images.unsplash.com/photo-1594932224011-042041c62fed?w=400" class="w-full h-full object-cover" alt="">
                                <button class="absolute top-2 right-2 w-6 h-6 bg-rose-500 text-white rounded-lg flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all"><i class="fa-solid fa-trash text-[10px]"></i></button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Sidebar Form -->
                <div class="space-y-8">
                    <div class="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm space-y-6">
                        <h2 class="text-lg font-black text-slate-800">Giá & Tồn kho</h2>
                        <div class="space-y-4">
                            <div class="space-y-2">
                                <label class="text-xs font-black uppercase tracking-widest text-slate-400">Giá bán ($)</label>
                                <input type="number" placeholder="0.00" class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 transition-all font-black text-indigo-600">
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-black uppercase tracking-widest text-slate-400">Số lượng trong kho</label>
                                <input type="number" placeholder="0" class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-black uppercase tracking-widest text-slate-400">Mã SKU</label>
                                <input type="text" placeholder="CL-2026-..." class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                            </div>
                        </div>
                    </div>

                    <div class="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm space-y-6">
                        <h2 class="text-lg font-black text-slate-800">Phân loại</h2>
                        <div class="space-y-4">
                            <div class="space-y-2">
                                <label class="text-xs font-black uppercase tracking-widest text-slate-400">Danh mục</label>
                                <select class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 transition-all bg-white font-bold">
                                    <option>Áo Sơ Mi</option>
                                    <option>Quần Âu</option>
                                    <option>Vest / Blazer</option>
                                </select>
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-black uppercase tracking-widest text-slate-400">Trạng thái</label>
                                <div class="flex gap-2">
                                    <button class="flex-1 py-3 bg-indigo-600 text-white font-bold rounded-xl text-xs">Công khai</button>
                                    <button class="flex-1 py-3 bg-slate-50 text-slate-400 font-bold rounded-xl text-xs hover:bg-slate-100 transition-all">Ẩn</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
