<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212" />
      <stop offset="100%" stop-color="#070707" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF6C7" />
      <stop offset="25%" stop-color="#EBC563" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="120" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" />

  <!-- Monogram "C" -->
  <text x="215" y="348" font-family="'Playfair Display', 'Times New Roman', serif" font-weight="900" font-size="310" fill="url(#goldGrad)" text-anchor="middle" filter="url(#goldGlow)">C</text>
  
  <!-- Luxury Signature Dot -->
  <circle cx="395" cy="335" r="32" fill="url(#goldGrad)" filter="url(#goldGlow)" />
</svg>
