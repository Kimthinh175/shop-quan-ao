<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLOSET | Quiet Luxury Fashion Store</title>
    <meta name="description" content="CLOSET - Đỉnh cao của nghệ thuật tối giản và thời trang thượng hạng. Kiến tạo những giá trị vượt thời gian.">

    <!-- Google Fonts: Playfair Display & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600;1,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['"Playfair Display"', 'serif'],
                    },
                    colors: {
                        brand: {
                            gold: '#c19a6b',
                            cream: '#faf9f6',
                            dark: '#0b0c10',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div id="app">
        <!-- Nội dung từ TypeScript sẽ được render vào đây -->
    </div>
    <script type="module" src="/src/app.ts"></script>
