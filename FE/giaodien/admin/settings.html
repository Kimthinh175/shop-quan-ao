<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cài đặt | Closet Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,900;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .sidebar-link { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 12px; font-size: 13px; font-weight: 600; color: #a5b4fc; transition: all 0.18s; cursor: pointer; }
        .sidebar-link:hover { background: rgba(255,255,255,0.08); color: #fff; }
        .sidebar-link.active { background: rgba(255,255,255,0.12); color: #fff; }
        .sidebar-link i { width: 20px; text-align: center; font-size: 14px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-60 bg-[#1e1b4b] flex flex-col py-6 px-4 shrink-0 overflow-y-auto">
        <div class="px-2 mb-8">
            <div class="font-serif text-2xl font-black text-white tracking-tight" style="font-family:'Playfair Display',serif;">CLOSET.</div>
            <div class="text-[10px] font-bold text-indigo-400 tracking-widest uppercase mt-0.5">Admin Panel</div>
        </div>
        <nav class="flex-1 space-y-1">
            <div class="text-[9px] font-black uppercase tracking-[0.2em] text-indigo-600 px-3 mb-2">Chính</div>
            <a href="dashboard.html" class="sidebar-link"><i class="fa-solid fa-chart-pie"></i> Tổng quan</a>
            <a href="orders.html" class="sidebar-link"><i class="fa-solid fa-receipt"></i> Đơn hàng</a>
            <a href="pos.html" class="sidebar-link"><i class="fa-solid fa-cash-register"></i> Bán hàng (POS)</a>
            <div class="text-[9px] font-black uppercase tracking-[0.2em] text-indigo-600 px-3 mt-5 mb-2">Kho hàng</div>
            <a href="products.html" class="sidebar-link"><i class="fa-solid fa-box"></i> Sản phẩm</a>
            <a href="inventory.html" class="sidebar-link"><i class="fa-solid fa-warehouse"></i> Tồn kho</a>
            <a href="categories.html" class="sidebar-link"><i class="fa-solid fa-tags"></i> Danh mục</a>
            <div class="text-[9px] font-black uppercase tracking-[0.2em] text-indigo-600 px-3 mt-5 mb-2">Khác</div>
            <a href="customers.html" class="sidebar-link"><i class="fa-solid fa-users"></i> Khách hàng</a>
            <a href="settings.html" class="sidebar-link active"><i class="fa-solid fa-gear"></i> Cài đặt</a>
        </nav>
        <div class="border-t border-indigo-900 pt-4 mt-4 flex items-center gap-3 px-2">
            <div class="w-9 h-9 rounded-full bg-indigo-600 flex items-center justify-center text-white font-black text-sm flex-shrink-0">A</div>
            <div>
                <p class="text-white text-xs font-bold leading-tight">Admin</p>
                <p class="text-indigo-400 text-[10px]">admin@closet.vn</p>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <!-- Topbar -->
        <header class="h-20 bg-white border-b border-slate-200 px-10 flex items-center justify-between shrink-0">
            <h1 class="text-xl font-black text-slate-800">Cài đặt</h1>
            <div class="flex items-center gap-6">
                <button class="px-6 py-2 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition-all flex items-center gap-2">
                    Lưu thay đổi
                </button>
                <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center text-white font-bold">T</div>
            </div>
        </header>

        <!-- Content -->
        <div class="flex-1 overflow-y-auto p-10">
            <div class="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden p-6">
                <p class="text-slate-500">Nội dung cài đặt hệ thống sẽ hiển thị ở đây.</p>
            </div>
        </div>
    </main>
</body>
</html>
